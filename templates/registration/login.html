{% extends 'master.html' %}
{% block body %}
<section style="padding: 60px 0 80px; min-height: 75vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row">
            <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
                <div style="background: #ffffff; border: 1px solid var(--slate-200); border-radius: var(--radius-lg); padding: 36px 30px; box-shadow: var(--shadow-md);">
                    <div style="text-align: center; margin-bottom: 24px;">
                        <div class="modern-brand-logo-icon" style="margin: 0 auto 14px; width: 48px; height: 48px; font-size: 22px;">
                            <i class="fa fa-lock"></i>
                        </div>
                        <h2 style="font-weight: 800; font-size: 22px; margin: 0 0 6px 0; color: var(--slate-900);">Welcome Back</h2>
                        <p style="font-size: 13px; color: var(--slate-500); margin: 0;">Sign in to access your orders and 24/7 AI support desk</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group" style="margin-bottom: 16px;">
                                {{ field.errors }}
                                <label style="font-size: 13px; font-weight: 700; color: var(--slate-700); margin-bottom: 6px;">{{ field.label }}</label>
                                <div style="position: relative;">
                                    <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}" class="form-control" placeholder="Enter your {{ field.label|lower }}" required style="height: 44px; border-radius: 8px; border: 1px solid var(--slate-300);" />
                                </div>
                            </div>
                        {% endfor %}

                        <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
                            <a href="{% url 'password_reset' %}" style="font-size: 12px; font-weight: 600; color: var(--brand-primary);">Forgot Password?</a>
                        </div>

                        <button class="btn-hero-primary" type="submit" style="width: 100%; justify-content: center; padding: 12px; font-size: 15px; border-radius: 8px;">
                            <i class="fa fa-sign-in"></i> Sign In to Account
                        </button>

                        <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--slate-100); font-size: 13px; color: var(--slate-500);">
                            Don't have an account? <a href="{% url 'signup' %}" style="font-weight: 700; color: var(--brand-primary);">Create one &rarr;</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
