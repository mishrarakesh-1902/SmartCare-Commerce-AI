{% extends 'master.html' %}
{% block body %}
<section style="padding: 60px 0 80px; min-height: 75vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row">
            <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
                <div style="background: #ffffff; border: 1px solid var(--slate-200); border-radius: var(--radius-lg); padding: 36px 30px; box-shadow: var(--shadow-md);">
                    <div style="text-align: center; margin-bottom: 24px;">
                        <div class="modern-brand-logo-icon" style="margin: 0 auto 14px; width: 48px; height: 48px; font-size: 22px;">
                            <i class="fa fa-user-plus"></i>
                        </div>
                        <h2 style="font-weight: 800; font-size: 22px; margin: 0 0 6px 0; color: var(--slate-900);">Create Your Account</h2>
                        <p style="font-size: 13px; color: var(--slate-500); margin: 0;">Join Ajara Shopper for personalized drops and fast checkout</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group" style="margin-bottom: 16px;">
                                {{ field.errors }}
                                <label style="font-size: 13px; font-weight: 700; color: var(--slate-700); margin-bottom: 6px;">{{ field.label }}</label>
                                {{ field }}
                            </div>
                        {% endfor %}

                        <button class="btn-hero-primary" type="submit" style="width: 100%; justify-content: center; padding: 12px; font-size: 15px; border-radius: 8px; margin-top: 10px;">
                            <i class="fa fa-check"></i> Complete Registration
                        </button>

                        <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--slate-100); font-size: 13px; color: var(--slate-500);">
                            Already have an account? <a href="{% url 'login' %}" style="font-weight: 700; color: var(--brand-primary);">Sign In &rarr;</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
